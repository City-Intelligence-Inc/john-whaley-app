<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Photos to Profiles</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a0a; color: #e0e0e0; }
.bar { background: #111; border-bottom: 1px solid #222; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; }
.bar h1 { font-size: 16px; font-weight: 600; }
.bar .stats { font-size: 13px; color: #888; display: flex; gap: 16px; }
.bar .stats .done { color: #4caf50; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; padding: 16px; }
.card {
  background: #111; border: 2px solid #222; border-radius: 12px; padding: 12px;
  text-align: center; cursor: pointer; transition: border-color 0.15s;
  position: relative;
}
.card:hover { border-color: #444; }
.card.active { border-color: #4fc3f7; }
.card.saved { border-color: #4caf50; }
.card .avatar {
  width: 72px; height: 72px; border-radius: 50%; margin: 0 auto 8px;
  background: #1a1a1a; display: flex; align-items: center; justify-content: center;
  overflow: hidden; border: 2px solid #222;
}
.card .avatar img { width: 100%; height: 100%; object-fit: cover; }
.card .avatar .initials { color: #555; font-size: 20px; font-weight: 700; }
.card .name { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .hl { font-size: 10px; color: #666; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.card .badge {
  position: absolute; top: 6px; right: 6px; font-size: 9px; padding: 2px 6px;
  border-radius: 4px; font-weight: 600;
}
.card .badge.s3 { background: #1b5e20; color: #a5d6a7; }
.card .badge.cdn { background: #1a237e; color: #90caf9; }
.card .badge.none { background: #333; color: #666; }
.modal {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 20;
  align-items: center; justify-content: center;
}
.modal.show { display: flex; }
.modal-box {
  background: #111; border: 1px solid #333; border-radius: 16px; padding: 24px;
  width: 400px; max-width: 90vw; text-align: center;
}
.modal-box .name { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
.modal-box .hl { font-size: 13px; color: #888; margin-bottom: 16px; }
.modal-box .drop {
  border: 2px dashed #333; border-radius: 12px; padding: 24px; min-height: 120px;
  display: flex; align-items: center; justify-content: center; flex-direction: column;
  transition: border-color 0.15s; cursor: pointer; margin-bottom: 16px;
}
.modal-box .drop:hover, .modal-box .drop.over { border-color: #4fc3f7; }
.modal-box .drop img { max-width: 120px; max-height: 120px; border-radius: 50%; }
.modal-box .drop .hint { color: #555; font-size: 13px; }
.modal-box .preview { margin-bottom: 16px; }
.modal-box .preview img { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 2px solid #333; }
.btn { padding: 10px 24px; border-radius: 8px; border: none; font-size: 14px; font-weight: 600; cursor: pointer; }
.btn-save { background: #2e7d32; color: #fff; }
.btn-save:hover { background: #388e3c; }
.btn-save:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-cancel { background: #222; color: #888; margin-right: 8px; }
.btn-open { background: #1a237e; color: #90caf9; margin-right: 8px; font-size: 12px; padding: 8px 14px; }
.toast {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  background: #2e7d32; color: #fff; padding: 8px 20px; border-radius: 8px;
  font-size: 13px; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 30;
}
.toast.show { opacity: 1; }
.toast.err { background: #c62828; }
.filter { display: flex; gap: 8px; align-items: center; }
.filter select, .filter input {
  background: #1a1a1a; border: 1px solid #333; color: #ccc; padding: 4px 8px;
  border-radius: 6px; font-size: 12px; outline: none;
}
</style>
</head>
<body>

<div class="bar">
  <h1>Photo Uploader</h1>
  <div class="filter">
    <input id="search" placeholder="Search..." oninput="render()">
    <select id="filterMode" onchange="render()">
      <option value="all">All</option>
      <option value="no-s3">Needs S3 photo</option>
      <option value="no-photo">No photo at all</option>
      <option value="done">Done (S3)</option>
    </select>
  </div>
  <div class="stats">
    <span id="statTotal">0 total</span>
    <span class="done" id="statDone">0 uploaded</span>
    <span id="statCdn">0 CDN only</span>
    <span id="statNone">0 no photo</span>
    <button onclick="openMissingLinkedIns()" style="background:#1a237e;color:#90caf9;border:1px solid #333;border-radius:6px;padding:4px 12px;font-size:11px;cursor:pointer;font-weight:600;">Open LinkedIns without S3</button>
  </div>
</div>

<div class="grid" id="grid"></div>

<div class="modal" id="modal">
  <div class="modal-box">
    <div class="name" id="mName"></div>
    <div class="hl" id="mHl"></div>
    <div class="preview" id="mPreview"></div>
    <div class="drop" id="mDrop">
      <span class="hint">Paste (Cmd+V), drag, or click to add photo</span>
    </div>
    <input type="file" id="mFile" accept="image/*" style="display:none">
    <div style="display:flex;justify-content:center;gap:8px;margin-top:12px;">
      <button class="btn btn-open" id="mOpen" onclick="window.open(activeUrl,'_blank')">Open LinkedIn</button>
      <button class="btn btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn btn-save" id="mSave" onclick="savePhoto()" disabled>Save Photo</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = 'https://aicm3pweed.us-east-1.awsapprunner.com';
let profiles = [];
let s3Photos = {};  // url -> s3 photo_url
let activeUrl = null;
let activeB64 = null;

function toast(msg, err) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (err ? ' err' : '');
  setTimeout(() => t.className = 'toast', 2000);
}

function initials(name) {
  return (name || '?').split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
}

function normKey(u) {
  try { u = decodeURIComponent(u); } catch {}
  return u.replace(/\/$/, '').replace(/^https?:\/\/(www\.)?linkedin\.com\/in\//i, '').toLowerCase();
}

function getS3Photo(url) {
  const k = normKey(url);
  for (const [u, v] of Object.entries(s3Photos)) {
    if (normKey(u) === k) return v;
  }
  return null;
}

const DEFAULT_PHOTO = '6a62a6a5-e5c7-45f0-b3a4-478dcdbe4f6f-57179232';

function photoStatus(p) {
  const s3 = getS3Photo(p.url);
  if (s3 && !s3.includes(DEFAULT_PHOTO)) return 's3';
  if (s3 && s3.includes(DEFAULT_PHOTO)) return 'default';
  if (p.photo && p.photo.includes('licdn.com')) return 'cdn';
  return 'none';
}

function render() {
  const search = document.getElementById('search').value.toLowerCase();
  const filter = document.getElementById('filterMode').value;
  const grid = document.getElementById('grid');

  let s3Count = 0, cdnCount = 0, noneCount = 0;
  let html = '';

  const order = { 'none': 0, 'default': 1, 'cdn': 2, 's3': 3 };
  const sorted = [...profiles].sort((a, b) => (order[photoStatus(a)] || 0) - (order[photoStatus(b)] || 0));

  for (const p of sorted) {
    const st = photoStatus(p);
    if (st === 's3') s3Count++;
    else if (st === 'cdn' || st === 'default') cdnCount++;
    else noneCount++;

    if (filter === 'no-s3' && st === 's3') continue;
    if (filter === 'no-photo' && st !== 'none' && st !== 'default') continue;
    if (filter === 'done' && st !== 's3') continue;
    if (search && !p.name.toLowerCase().includes(search) && !p.headline.toLowerCase().includes(search)) continue;

    const url = p.url.replace(/\/$/, '');
    const imgSrc = getS3Photo(url) || p.photo || '';
    const avatar = imgSrc
      ? `<img src="${imgSrc}" onerror="this.parentElement.innerHTML='<span class=initials>${initials(p.name)}</span>'">`
      : `<span class="initials">${initials(p.name)}</span>`;

    const badgeClass = st === 's3' ? 'badge s3' : st === 'default' ? 'badge none' : st === 'cdn' ? 'badge cdn' : 'badge none';
    const badgeText = st === 's3' ? 'S3' : st === 'default' ? 'DEF' : st === 'cdn' ? 'CDN' : '--';

    html += `<div class="card ${st === 's3' ? 'saved' : ''}" data-url="${url.replace(/"/g,'&quot;')}">
      <span class="${badgeClass}">${badgeText}</span>
      <div class="avatar">${avatar}</div>
      <div class="name">${p.name}</div>
      <div class="hl">${p.headline}</div>
    </div>`;
  }

  grid.innerHTML = html;
  document.getElementById('statTotal').textContent = `${profiles.length} total`;
  document.getElementById('statDone').textContent = `${s3Count} uploaded`;
  document.getElementById('statCdn').textContent = `${cdnCount} CDN only`;
  document.getElementById('statNone').textContent = `${noneCount} no photo`;
}

// Event delegation for card clicks
document.getElementById('grid').addEventListener('click', (e) => {
  const card = e.target.closest('.card[data-url]');
  if (card) openModal(card.dataset.url);
});

function openModal(url) {
  const k = normKey(url);
  const p = profiles.find(x => normKey(x.url) === k);
  if (!p) return;
  activeUrl = p.url;  // always use the original CSV URL
  activeB64 = null;
  document.getElementById('mName').textContent = p.name;
  document.getElementById('mHl').textContent = p.headline;

  const imgSrc = getS3Photo(url) || p.photo || '';
  document.getElementById('mPreview').innerHTML = imgSrc
    ? `<img src="${imgSrc}" onerror="this.remove()">`
    : '';

  document.getElementById('mDrop').innerHTML = '<span class="hint">Paste (Cmd+V), drag, or click to add photo</span>';
  document.getElementById('mSave').disabled = true;
  document.getElementById('modal').classList.add('show');
}

function closeModal() {
  document.getElementById('modal').classList.remove('show');
  activeUrl = null;
  activeB64 = null;
}

function setDropPhoto(dataUrl) {
  activeB64 = dataUrl;
  document.getElementById('mDrop').innerHTML = `<img src="${dataUrl}"><button onclick="event.stopPropagation();clearDropPhoto()" style="position:absolute;top:4px;right:4px;background:#c62828;color:#fff;border:none;border-radius:50%;width:24px;height:24px;cursor:pointer;font-size:14px;line-height:24px;text-align:center;">✕</button>`;
  document.getElementById('mDrop').style.position = 'relative';
  document.getElementById('mSave').disabled = false;
}

function clearDropPhoto() {
  activeB64 = null;
  document.getElementById('mDrop').innerHTML = '<span class="hint">Paste (Cmd+V), drag, or click to add photo</span>';
  document.getElementById('mDrop').style.position = '';
  document.getElementById('mSave').disabled = true;
}

async function savePhoto() {
  if (!activeUrl || !activeB64) { toast('No photo or URL', true); return; }
  const btn = document.getElementById('mSave');
  btn.disabled = true;
  btn.textContent = 'Saving...';

  // Validate we have real image data
  if (!activeB64.startsWith('data:image/')) {
    toast('Invalid image data', true);
    btn.disabled = false;
    btn.textContent = 'Save Photo';
    return;
  }

  console.log('Saving photo for:', activeUrl, 'b64 length:', activeB64.length);

  try {
    const resp = await fetch(`${API}/api/v1/linkedin/photo`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url: activeUrl, photo_base64: activeB64 }),
    });
    const text = await resp.text();
    console.log('Response:', resp.status, text);
    let data;
    try { data = JSON.parse(text); } catch { toast('Bad response: ' + text.slice(0, 100), true); return; }

    if (data.photo_url) {
      s3Photos[data.url || activeUrl] = data.photo_url;
      s3Photos[activeUrl] = data.photo_url;
      toast('Saved!');
      closeModal();
      render();
    } else {
      toast(data.error || 'Failed — check console', true);
      console.error('Save error:', data);
    }
  } catch (e) {
    toast('Network error: ' + e.message, true);
    console.error('Fetch error:', e);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Save Photo';
  }
}

// Drop zone
const drop = document.getElementById('mDrop');
drop.addEventListener('click', () => document.getElementById('mFile').click());
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave', () => drop.classList.remove('over'));
drop.addEventListener('drop', e => {
  e.preventDefault(); drop.classList.remove('over');
  const file = e.dataTransfer.files[0];
  if (file && file.type.startsWith('image/')) {
    const r = new FileReader();
    r.onload = ev => setDropPhoto(ev.target.result);
    r.readAsDataURL(file);
  }
});
document.getElementById('mFile').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const r = new FileReader();
  r.onload = ev => setDropPhoto(ev.target.result);
  r.readAsDataURL(file);
});

// Paste anywhere when modal is open
document.addEventListener('paste', e => {
  if (!document.getElementById('modal').classList.contains('show')) return;
  for (const item of e.clipboardData.items) {
    if (item.type.startsWith('image/')) {
      e.preventDefault();
      const r = new FileReader();
      r.onload = ev => setDropPhoto(ev.target.result);
      r.readAsDataURL(item.getAsFile());
      return;
    }
  }
});

// ESC to close
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

// Load profiles and check which already have S3 photos
async function init() {
  try {
    const resp = await fetch(`${API}/linkedin/database`);
    const data = await resp.json();
    const dbMap = {};
    for (const item of (data.items || [])) {
      const url = item.url;
      dbMap[url] = item;
      if (item.photo_url && item.photo_url.includes('s3.amazonaws.com')) {
        s3Photos[url] = item.photo_url;
      }
    }
  } catch (e) {
    console.error('Failed to load DB:', e);
  }

  profiles = PROFILES;
  render();
}

let openBatchIndex = 0;
function openMissingLinkedIns() {
  const toOpen = profiles.filter(p => { const s = photoStatus(p); return s !== 's3'; });
  if (!toOpen.length) { toast('All photos are on S3!'); openBatchIndex = 0; return; }
  const batch = toOpen.slice(openBatchIndex, openBatchIndex + 10);
  if (!batch.length) { toast('Done — all batches opened. Click again to restart.'); openBatchIndex = 0; return; }
  const batchNum = openBatchIndex/10 + 1;
  const startTime = new Date();
  console.log(`--- Batch ${batchNum} started at ${startTime.toLocaleTimeString()} (${batch.length} profiles) ---`);
  batch.forEach((p, i) => {
    console.log(`  ${openBatchIndex + i + 1}. ${p.name} — ${p.url}`);
    window.open(p.url, '_blank');
  });
  // Write timestamp so CLI can read it
  fetch(`${API}/api/v1/linkedin/photo`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ url: '_timer_', photo_base64: '' }),
  }).catch(() => {});
  // Signal the watcher via a temp file
  const signal = JSON.stringify({ batch: batchNum, time: startTime.toISOString(), count: batch.length, names: batch.map(p => p.name) });
  localStorage.setItem('batch_start', signal);
  // POST signal to backend (it'll 400 but that's fine — watcher reads the file instead)
  try {
    const xhr = new XMLHttpRequest();
    xhr.open('PUT', `${API}/settings/batch-timer`, false);
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.send(JSON.stringify({ setting_id: 'batch_timer', value: signal }));
  } catch {}
  console.log('Names to scrape:', batch.map(p => p.name).join(', '));
  openBatchIndex += 10;
  toast(`Opened ${Math.min(openBatchIndex, toOpen.length)}/${toOpen.length}`);
}
